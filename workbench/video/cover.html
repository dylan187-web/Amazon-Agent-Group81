<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>封面</title>
<style>
html,body{margin:0;height:100%}
body{background:radial-gradient(circle at 70% 30%,#1e3a78 0,#0f1b33 55%);color:#fff;font-family:-apple-system,"PingFang SC",sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
.wrap{width:78%}
.tabs{display:flex;gap:14px;margin-bottom:56px;flex-wrap:wrap}
.tab{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:12px 12px 0 0;padding:12px 20px;font-size:20px;color:#cdd6ea;opacity:0;transform:translateY(12px);animation:in .5s forwards}
.tab:nth-child(1){animation-delay:.6s}.tab:nth-child(2){animation-delay:1.4s}.tab:nth-child(3){animation-delay:2.2s}.tab:nth-child(4){animation-delay:3s}.tab:nth-child(5){animation-delay:3.8s}
@keyframes in{to{opacity:1;transform:none}}
.line{width:72px;height:5px;background:#ff9a3c;border-radius:3px;margin-bottom:26px}
h1{font-size:76px;margin:0 0 18px;letter-spacing:1px}
.sub{font-size:38px;color:#cfe0ff;margin-bottom:46px}
.meta{font-size:22px;color:#8fa0c2}
</style></head>
<body><div class="wrap">
  <div class="tabs"><div class="tab">关键词工具</div><div class="tab">竞品页面</div><div class="tab">利润表</div><div class="tab">Listing 后台</div><div class="tab">广告后台</div></div>
  <div class="line"></div>
  <h1>Amazon Agent Group81</h1>
  <div class="sub">一句话，从选品跑到开广告</div>
  <div class="meta">生财跨境 Agent 大课 · 黑客松第 81 组 · 每个数字都追得到来源</div>
</div></body></html>
